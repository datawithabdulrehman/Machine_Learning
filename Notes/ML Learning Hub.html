const L=[
{id:'ml-intro',s:'learn',t:'What is Machine Learning?',g:'hier',w:'Machine Learning (ML) lets computers learn patterns from examples instead of following hand-written rules. AI is the broad goal of smart machines, ML is one way to get there, Deep Learning is ML with many-layered neural networks, and Generative AI creates new text, images or code.',h:'Traditional programming: Rules + Data → Answers. ML: Data + Answers → Rules (a model). The trained model then makes predictions (inference) on new data.',ex:'A spam filter: instead of writing rules for every scam phrase, show it thousands of emails labelled spam / not spam.',m:'A model is a function f(x; θ) ≈ y; learning means choosing parameters θ that minimize a loss on data.',c:`from sklearn.linear_model import LogisticRegression

print(model.predict([[2.5]]))`,o:'[1]',x:'Import a model class|X holds inputs, y holds the known answers|fit() learns the pattern from X and y|predict() answers for a new input',mi:'Treating ML as magic: a model only reflects patterns present in its data.',pr:'Handles patterns too complex to hand-code.',li:'Needs good data; can be wrong or biased.',r:['features'],q:['Which is TRUE about ML?',['Rules are written by hand','Rules are learned from data','It needs no data'],1,'ML learns the rules (a model) from data plus answers.']},
{id:'features',s:'learn',t:'Features, Target & the ML Pipeline',g:'pipe',w:'Features are the inputs a model looks at; the target is what you want to predict; one row is a sample.',h:'Data → split into train / validation / test → train → evaluate → predict. Parameters are learned by the model; hyperparameters (like k in KNN) are settings you choose.',ex:'House prices — features: area, bedrooms, bathrooms, location. Target: price.',m:'X is an n×d matrix (n samples, d features); y is a vector of length n.',c:`import pandas as pd

y = df['price']
print(X.shape, y.shape)`,o:'(3, 2) (3,)',x:'Build a small table|X = feature columns only|y = the target column|shape shows rows × columns',mi:'Leaving the target inside X (data leakage).',r:['pandas','impute'],q:['In house-price prediction, "price" is the…',['Feature','Target','Hyperparameter'],1,'The target is the value you want to predict.']},
{id:'pandas',s:'data',t:'Pandas: Loading & Inspecting Data',w:'Pandas is the Python library for tables (DataFrames). Nearly every ML project starts by loading and inspecting data with it.',h:'read_csv loads a file, head() previews rows, info() shows types and missing values, describe() gives statistics, groupby() summarizes by category.',ex:'Load sales.csv, check missing values, then average sales per city.',m:'describe() reports count, mean, std, min, quartiles, max.',c:`import pandas as pd
df = pd.DataFrame({'city':['A','B','A'],'sales':[10,20,30]})

city
A    20.0

Name: sales, dtype: float64`,x:'Import pandas|Create a small DataFrame|shape = (rows, columns)|Group rows by city and average sales',mi:'KeyError — column names are case-sensitive; check df.columns.',pr:'Fast, expressive table handling.',li:'Holds data in memory.',r:['impute'],q:['Which call shows column types and non-null counts?',['df.head()','df.info()','df.shape'],1,'info() lists dtypes and non-null counts.']},
{id:'impute',s:'prep',t:'Missing Values & Imputation',w:'Real data has blanks. Imputation fills them so models can train.',h:'Mean suits symmetric numeric data, median resists outliers, mode suits categories. Fit the imputer on training data only, then apply it to test data.',ex:'A salary column with blanks and one huge outlier → use the median.',m:'Mean = Σx/n. Median = middle value after sorting.',c:`from sklearn.impute import SimpleImputer

{id:'linreg',s:'sup',t:'Linear Regression',g:'lin',w:'Linear regression draws the best straight line through points to predict a number.',h:'Prediction ŷ = w·x + b. Training finds w and b that minimize average squared error, using gradient descent or a closed-form solution.',ex:'Predict salary from years of experience.',m:'Loss = (1/n)Σ(ŷ−y)². Update: w ← w − η·∂L/∂w, where η is the learning rate. Closed form: w = (XᵀX)⁻¹Xᵀy.',c:`from sklearn.linear_model import LinearRegression

{id:'knn',s:'sup',t:'K-Nearest Neighbors',g:'knn',w:'KNN classifies a point by a vote among its k closest training points.',h:'Store the data → measure distance to every point → take the k nearest → majority vote. Small k gives a jagged boundary (overfits); large k is smoother (may underfit). Scale features first.',ex:'Recommend a product by finding the most similar customers.',m:'Euclidean distance d = √Σ(aᵢ−bᵢ)². Prediction cost is O(n·d) per query without an index.',c:`from sklearn.neighbors import KNeighborsClassifier

{id:'cm',s:'sup',t:'Confusion Matrix & Classification Metrics',g:'cm',w:'A confusion matrix counts right and wrong predictions: TP, TN, FP, FN.',h:'TP: predicted positive, truly positive. FP: false alarm. FN: a missed positive. TN: correct negative. Precision = TP/(TP+FP); Recall = TP/(TP+FN); F1 is their harmonic mean.',ex:'Disease detection: an FN is a sick patient told they are healthy — often the costliest error. Spam: an FP hides a real email.',m:'Accuracy = (TP+TN)/all · F1 = 2PR/(P+R) · Specificity = TN/(TN+FP) · FPR = FP/(FP+TN).',c:`from sklearn.metrics import classification_report

{id:'kmeans',s:'unsup',t:'K-Means Clustering',g:'km',w:'K-Means groups unlabeled points into K clusters.',h:'Pick K → place K centroids → assign each point to its nearest centroid → move each centroid to its cluster mean → repeat until stable.',ex:'Segment customers by spending and visit frequency.',m:'Minimizes inertia Σ‖x − μ_cluster‖². Cost ≈ O(n·K·iterations); results depend on initialization.',c:`from sklearn.cluster import KMeans

{id:'qlearn',s:'rl',t:'Reinforcement Learning & Q-Learning',g:'rl',w:'An agent learns by trial and error: it acts in an environment and receives rewards or penalties.',h:'State → Action → Reward → New state → repeat. Q-learning stores a value Q for each (state, action). Exploration tries new actions; exploitation uses the best known one.',ex:'A robot finding a path; a game-playing AI.',m:'Q(s,a) ← Q(s,a) + α[r + γ·maxₐ′Q(s′,a′) − Q(s,a)]',c:`# one Q-learning update

{id:'rag',s:'rag',t:'RAG: Retrieval-Augmented Generation',g:'rag',w:'RAG lets a language model answer using your own documents, retrieved at question time.',h:'Chunk documents → embed chunks as vectors → store them in a vector database → embed the question → retrieve the most similar chunks → give them to the LLM as context. Grounding answers in sources reduces, but does not eliminate, hallucination.',ex:'"Chat with PDF": ask questions about a report.',m:'Cosine similarity: cos(a,b) = a·b / (‖a‖‖b‖).',c:`import numpy as np

{id:'agent',s:'agent',t:'Agentic AI',g:'agent',w:'Agentic AI systems plan, use tools, observe results and repeat until a goal is reached.',h:'Goal → Plan → Tool → Observation → Reasoning → Action → Result. Memory keeps context across steps.',ex:'A research assistant that searches, reads and drafts a summary.',c:`goal = "summarize today's news"
